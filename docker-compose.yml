services:
  app:
    build: .
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@spearfishing.by}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-mfe-2hD-Zj7-3EL}
    volumes:
      - app-data:/app/data
    restart: unless-stopped

volumes:
  app-data:
